<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0e2a6d" />
      <stop offset="60%" stop-color="#081438" />
      <stop offset="100%" stop-color="#030818" />
    </radialGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0066ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="favCyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="60%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="favFlame" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="60%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#002288" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Container as shown in the second image -->
  <rect x="20" y="20" width="472" height="472" rx="115" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="6" />

  <!-- Inner Soft Lighting Glow -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.3" />

  <!-- Orbit Sweeps inside Squircle -->
  <!-- Left Outer Swoop -->
  <path d="M 120 340 C 75 235 115 125 205 90 C 215 86 210 78 200 81 C 90 120 45 250 105 360 C 110 368 118 360 120 340 Z" 
        fill="#00f0ff" filter="url(#favGlow)" />

  <!-- Right Outer Swoop -->
  <path d="M 220 422 C 320 445 410 390 442 280 C 448 260 450 230 448 215 C 446 208 440 210 442 220 C 445 292 370 430 220 422 Z" 
        fill="#00d0ff" filter="url(#favGlow)" />

  <!-- Rocket Exhaust -->
  <path d="M 235 340 
           L 195 400 
           L 215 382 
           L 165 430 
           L 192 408 
           L 130 455 
           L 185 405 
           L 175 385 
           L 220 355 
           Z" 
        fill="url(#favFlame)" filter="url(#favGlow)" />

  <!-- Rocket Left Fin -->
  <path d="M 235 295 C 200 290 162 312 152 332 C 175 342 218 328 235 315 Z" 
        fill="#0284c7" stroke="#00ffff" stroke-width="3" />

  <!-- Rocket Right Fin -->
  <path d="M 325 360 C 345 400 320 415 282 410 C 288 395 312 370 325 360 Z" 
        fill="#0369a1" stroke="#00f0ff" stroke-width="3" />

  <!-- Main Fuselage -->
  <path d="M 235 330 
           C 270 280 340 225 420 130 
           C 455 90 440 155 395 250 
           C 350 330 290 355 265 355 
           Z" 
        fill="#051738" stroke="url(#favCyanGrad)" stroke-width="7" />

  <!-- Rocket Nose Glare -->
  <path d="M 380 150 C 408 125 420 112 428 106" 
        stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.9" />

  <!-- Windows -->
  <circle cx="370" cy="210" r="22" fill="#031633" stroke="#00f0ff" stroke-width="5" />
  <circle cx="370" cy="210" r="14" fill="#00f0ff" filter="url(#favGlow)" />
  <circle cx="366" cy="206" r="4.5" fill="#ffffff" />

  <circle cx="338" cy="248" r="15" fill="#031633" stroke="#00e5ff" stroke-width="4" />
  <circle cx="338" cy="248" r="9" fill="#00e5ff" />
  <circle cx="335" cy="245" r="3" fill="#ffffff" />

  <!-- Businessman Body & Tie -->
  <path d="M 250 155 C 215 160 180 172 155 170 C 175 178 200 176 230 166 L 255 160 Z" 
        fill="#00d8ff" filter="url(#favGlow)" />

  <path d="M 255 140 
           L 295 155 
           L 315 220 
           L 275 255 
           L 228 255 
           L 220 225 
           L 240 200 
           Z" 
        fill="url(#favCyanGrad)" stroke="#00f0ff" stroke-width="3" />

  <!-- Left Arm -->
  <path d="M 240 180 L 205 215 L 220 240 L 242 225" 
        stroke="url(#favCyanGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 240 180 L 205 215 L 220 240 L 242 225" 
        stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Right Arm -->
  <path d="M 295 160 L 335 180 L 350 188" 
        stroke="url(#favCyanGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="350" cy="188" r="8" fill="#38bdf8" />

  <!-- Head & Hair -->
  <path d="M 258 130 L 265 145 L 278 142 L 272 128 Z" fill="#38bdf8" />
  <path d="M 262 128 L 275 120 L 282 115 L 280 108 L 272 105 L 262 102 C 250 95 240 105 242 118 C 243 128 252 130 262 128 Z" 
        fill="#93c5fd" />
  <path d="M 248 102 C 250 85 268 75 280 82 C 270 88 276 94 282 92 C 272 100 278 105 274 108 C 265 104 256 105 248 102 Z" 
        fill="#00e5ff" filter="url(#favGlow)" />

  <!-- Legs -->
  <path d="M 260 250 C 280 250 305 258 320 280 C 328 295 315 330 290 350 L 270 335 C 290 315 295 295 285 282 C 278 272 260 265 245 265 Z" 
        fill="url(#favCyanGrad)" stroke="#00f0ff" stroke-width="2.5" />

  <!-- Shoe -->
  <path d="M 290 350 L 305 358 C 308 360 302 366 290 365 L 270 335 Z" 
        fill="#021430" stroke="#00ffff" stroke-width="2" />
</svg>
